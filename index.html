<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
       
        <div class="display">0</div>
        
        <div class="buttons">
            <button class="clear">C</button>
            <button class="decimal">.</button>
            <button class="backspace">←</button>
            <button class="operator btn-divide">/</button>
                        
            <button class="number btn-7">7</button>
            <button class="number btn-8">8</button>
            <button class="number btn-9">9</button>
            <button class="operator btn-multiply">*</button>
            
            <button class="number btn-4">4</button>
            <button class="number btn-5">5</button>
            <button class="number btn-6">6</button>
            <button class="operator btn-minus">-</button>
            
            <button class="number btn-1">1</button>
            <button class="number btn-2">2</button>
            <button class="number btn-3">3</button>
            <button class="operator btn-plus">+</button>
            
            <button class="number btn-0">0</button>
            <button class="equals">=</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
